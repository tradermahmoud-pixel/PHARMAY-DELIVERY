name: diag
on:
  workflow_dispatch:
    inputs:
      user: { description: user, required: true }
      pass: { description: pass, required: true }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe attendance
        run: |
          B="https://pharmacy-delivery-ekv2.onrender.com/erp"
          # wake + login
          curl -s --max-time 90 "$B/healthz" >/dev/null || true
          CJ=$(mktemp)
          curl -s --max-time 90 -c "$CJ" -H 'Content-Type: application/json' \
            -d "{\"username\":\"${{ github.event.inputs.user }}\",\"password\":\"${{ github.event.inputs.pass }}\"}" \
            "$B/api/login" >/dev/null
          echo "RESULT_ATT_14=$(curl -s --max-time 90 -b "$CJ" "$B/api/attendance?days=14" | head -c 400)"
          echo "RESULT_ATT_120=$(curl -s --max-time 90 -b "$CJ" "$B/api/attendance?days=120" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(len(d),"rows; sample:",json.dumps(d[0],ensure_ascii=False) if d else "none")' 2>/dev/null || echo parsefail)"
          echo "RESULT_REP_WIDE=$(curl -s --max-time 90 -b "$CJ" "$B/api/attendance-report?from=2026-01-01&to=2026-12-31" | head -c 600)"
          echo "RESULT_EMP=$(curl -s --max-time 90 -b "$CJ" "$B/api/me" | head -c 300)"
