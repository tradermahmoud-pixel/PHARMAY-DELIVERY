name: diag
on:
  workflow_dispatch:
    inputs:
      q:
        description: search query
        required: false
        default: bruf
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query diagnostic endpoint
        run: |
          Q="${{ github.event.inputs.q }}"
          URL="https://pharmacy-delivery-ekv2.onrender.com/erp/api/diag?token=kC5OyGwCah2G2zPW6KIW1spt0tU2mfdm&q=$Q"
          R=$(curl -s --max-time 70 "$URL" | tr -d '\n' | tr -d '\r')
          echo "RESULTLINE:$R:ENDRESULT"
